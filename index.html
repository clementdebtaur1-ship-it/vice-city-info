<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="GTA Vice City - codes de triche">
<title>GTA Vice City — Codes</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060912;--panel:#0d1420;--panel2:#111b29;--accent:#00d4ff;
  --accent2:#7c3aed;--text:#e8f0f8;--muted:#8fa1b5;
  --border:rgba(0,212,255,.18);--shadow:0 24px 70px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;padding:28px 16px;
  color:var(--text);font-family:'Rajdhani',sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(0,212,255,.10),transparent 30%),
    radial-gradient(circle at 85% 90%,rgba(124,58,237,.10),transparent 30%),var(--bg);
}
.container{width:min(920px,100%);margin:auto}
.card{
  overflow:hidden;background:linear-gradient(145deg,rgba(17,27,41,.98),rgba(9,15,25,.98));
  border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);
}
.hero{padding:38px 30px 28px;text-align:center;border-bottom:1px solid var(--border)}
.badge{
  display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;
  border:1px solid var(--border);background:rgba(0,212,255,.07);color:var(--accent);
  font-weight:700;letter-spacing:1px;font-size:.82rem;text-transform:uppercase
}
h1{
  margin:18px 0 8px;font-family:Orbitron,monospace;font-size:clamp(1.8rem,5vw,3rem);
  letter-spacing:2px;color:var(--accent);text-shadow:0 0 25px rgba(0,212,255,.25)
}
.subtitle{margin:0 auto;color:var(--muted);font-size:1.08rem;max-width:650px}
.toolbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:16px 20px;background:rgba(4,9,16,.55);border-bottom:1px solid var(--border)
}
.toolbar label{color:var(--muted);font-weight:700}
select{
  min-width:180px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);font:inherit;font-weight:700;outline:none
}
.content{padding:24px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:15px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
th{
  background:rgba(0,212,255,.06);color:var(--accent);font-family:Orbitron,monospace;
  font-size:.78rem;letter-spacing:1px;text-transform:uppercase
}
tr:last-child td{border-bottom:0}
tbody tr{transition:.2s;background:transparent}
tbody tr:hover{background:rgba(0,212,255,.045)}
.code{
  display:inline-block;padding:6px 10px;border-radius:8px;
  background:#070c14;border:1px solid rgba(0,212,255,.2);color:#fff;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;letter-spacing:.5px
}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:48px;
  padding:0 22px;border-radius:11px;text-decoration:none;font-family:Orbitron,monospace;
  font-size:.82rem;font-weight:800;letter-spacing:1px;transition:.2s
}
.btn-play{background:var(--accent);color:#041019;box-shadow:0 0 24px rgba(0,212,255,.18)}
.btn-back{border:1px solid var(--border);color:var(--text);background:rgba(255,255,255,.03)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.footer{text-align:center;color:#65788e;font-size:.86rem;margin-top:18px}
@media(max-width:650px){
  body{padding:12px}.hero{padding:28px 18px 22px}.content{padding:14px}
  .toolbar{align-items:stretch;flex-direction:column}.toolbar select{width:100%}
  .actions{flex-direction:column}.btn{width:100%}
}
</style>
</head>
<body>
<main class="container">
  <section class="card">
    <header class="hero">
      <div class="badge" id="locationBadge">🌍 <span data-i18n="detected">Langue détectée</span></div>
      <h1 data-i18n="title">GTA Vice City — Codes</h1>
      <p class="subtitle" data-i18n="subtitle">Les principaux codes de triche, présentés clairement et automatiquement dans la langue de ton navigateur.</p>
    </header>

    <div class="toolbar">
      <label for="language" data-i18n="language">Langue</label>
      <select id="language" aria-label="Language"></select>
    </div>

    <div class="content">
      <div class="table-wrap">
        <table>
          <thead><tr><th data-i18n="effect">Effet</th><th data-i18n="code">Code</th></tr></thead>
          <tbody id="cheats"></tbody>
        </table>
      </div>

      <div class="actions">
        <a href="http://clement.deb.taur.free.fr/GTA.html" class="btn btn-play" data-i18n="play">Jouer au jeu</a>
        <a href="Game.html" class="btn btn-back" data-i18n="back">← Retour au portail</a>
      </div>
    </div>
  </section>
  <div class="footer" id="footer"></div>
</main>

const regionNames = new Intl.DisplayNames([navigator.language || "en"], {type:"region"});
const langSelect = document.getElementById("language");

function detectLanguage(){
  const candidates = navigator.languages?.length ? navigator.languages : [navigator.language || "en"];
  for(const l of candidates){
    const key=l.toLowerCase().split("-")[0];
    if(data[key]) return key;
  }
  return "en";
}
function detectRegion(){
  try{
    const loc = new Intl.Locale(navigator.language || "en");
    const region = loc.region || "";
    return region ? regionNames.of(region) : "";
  }catch(e){ return ""; }
}
function render(lang){
  const d=data[lang]||data.en;
  document.documentElement.lang=lang;
  document.title=d.title;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.dataset.i18n;if(d[k]) el.textContent=d[k];
  });
  document.getElementById("cheats").innerHTML=d.cheats.map(([effect,code])=>
    `<tr><td>${effect}</td><td><span class="code">${code}</span></td></tr>`).join("");
  const region=detectRegion();
  document.getElementById("locationBadge").innerHTML=`🌍 <span>${d.detected}${region ? " · "+region : ""}</span>`;
  document.getElementById("footer").textContent=d.footer;
  langSelect.value=lang;
}
Object.entries(data).forEach(([key,d])=>{
  const opt=document.createElement("option");opt.value=key;opt.textContent=d.name;langSelect.appendChild(opt);
});
const initial=detectLanguage();
render(initial);
langSelect.addEventListener("change",e=>render(e.target.value));
</script>
</body>
</html>
